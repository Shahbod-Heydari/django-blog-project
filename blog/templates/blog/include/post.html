{% load static %}

<li>
    <article class="post">
        <a href="{% url 'post-detail-page' post.slug %}"> <!--this arg was for the slug-->
            <img src="{% static 'blog/images/'|add:post.image %}" alt={{ post.title }}>
            <div class="post__content">
                <h3>{{post.title|title}}</h3>
                <p>{{ post.short_description|title }}</p>
            </div>
        </a>
    </article>
</li>
